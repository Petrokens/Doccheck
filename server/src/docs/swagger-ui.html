<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>DocCheck AI API · Swagger</title>
  <link rel="stylesheet" href="/api/docs/swagger-ui.css" />
  <style>
    :root {
      --navy: #0B4D99;
      --navy-dark: #082f5e;
      --ink: #0c2340;
      --muted: #4f6490;
      --line: #c4d2f0;
      --page: #F2F6FF;
      --card: #ffffff;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      color: var(--ink);
    }
    .docs-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .docs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px;
      background: linear-gradient(135deg, var(--navy-dark), var(--navy));
      color: #fff;
      box-shadow: 0 8px 24px rgba(11, 77, 153, 0.28);
    }
    .docs-kicker {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .docs-header h1 {
      margin: 4px 0 0;
      font-size: 22px;
      letter-spacing: 0.08em;
    }
    .docs-header p { margin: 6px 0 0; font-size: 13px; opacity: 0.88; }
    .docs-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .docs-actions a {
      display: inline-flex;
      align-items: center;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
    }
    .docs-actions a.primary { background: #fff; color: var(--navy); border-color: #fff; }
    .docs-main { flex: 1; padding: 8px 0 40px; }
    .swagger-ui { font-family: inherit; }
    .swagger-ui .topbar,
    .swagger-ui .information-container .info .title small { display: none; }
    .swagger-ui .wrapper { padding: 0 20px; max-width: 1180px; }
    .swagger-ui .info { margin: 18px 0 10px; }
    .swagger-ui .info .title { color: var(--navy); font-size: 28px; }
    .swagger-ui .info p, .swagger-ui .info li { color: var(--muted); font-size: 14px; }
    .swagger-ui .scheme-container {
      background: var(--card);
      box-shadow: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      margin: 0 20px 18px;
      padding: 12px 16px;
    }
    .swagger-ui .btn.authorize {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      border-radius: 10px;
      box-shadow: none;
    }
    .swagger-ui .btn.execute { background: var(--navy); border-color: var(--navy); }
    .swagger-ui .opblock {
      border-radius: 14px;
      box-shadow: none;
      margin: 0 0 10px;
      border-width: 1px;
    }
    .swagger-ui .opblock .opblock-summary-path { font-weight: 700; }
    .swagger-ui .opblock-tag {
      border: 0;
      font-size: 15px;
      color: var(--ink);
    }
    .swagger-ui section.models { border-radius: 16px; }
    .swagger-ui .filter-container input {
      border-radius: 10px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="docs-shell">
    <header class="docs-header">
      <div>
        <p class="docs-kicker">DocCheck AI</p>
        <h1>API DOCS</h1>
        <p>OpenAPI 3 Swagger UI · Try every backend route in the browser</p>
      </div>
      <div class="docs-actions">
        <a class="primary" href="#swagger-ui">Browse APIs</a>
        <a href="/api/docs.json">OpenAPI JSON</a>
      </div>
    </header>
    <main class="docs-main">
      <div id="swagger-ui"></div>
    </main>
  </div>
  <script src="/api/docs/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/api/docs.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      persistAuthorization: true,
      withCredentials: true,
      displayRequestDuration: true,
      filter: true,
      tryItOutEnabled: true,
      docExpansion: 'list',
      defaultModelsExpandDepth: 0,
      tagsSorter: 'alpha',
      operationsSorter: 'alpha',
      requestInterceptor: function (req) {
        req.headers['X-Requested-With'] = 'DocCheck';
        return req;
      }
    });
  </script>
</body>
</html>
